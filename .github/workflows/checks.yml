name: checks

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and syntax
        run: |
          python -m unittest discover -s docinanie_ortofotomapy_geoportal/tests -v
          python -m compileall -q docinanie_ortofotomapy_geoportal
      - name: Check installation package
        run: |
          python scripts/package_plugin.py
          git diff --exit-code -- Ortofotomapa-do-dzialki-QGIS.zip
